AWSTemplateFormatVersion: '2010-09-09'
Description: marathon-odoo - ALB + HTTPS in front of Odoo EC2 instance

Parameters:
  CertificateArn:
    Type: String
    Description: ACM certificate ARN (must be in this region) covering the domain.
    Default: arn:aws:acm:us-east-1:276098230907:certificate/0cda89ee-7e44-4aa7-8d2b-def3e6c09452
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-a9f5b1cd
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets in different AZs for the ALB.
    Default: "subnet-b15895e9,subnet-85c268f3"
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Default: i-0285933d747cd2a5a
  InstanceSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing SG on the Odoo instance. ALB ingress is added to it.
    Default: sg-059aafef44c9299ea
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z0375928R2ZK2ENITB9I
  DomainName:
    Type: String
    Default: odoo.marathon-ops.com
  OdooPort:
    Type: Number
    Default: 8069

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: marathon-odoo ALB ingress (80, 443)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Stack
          Value: marathon-odoo
        - Key: Name
          Value: marathon-odoo-alb-sg

  InstanceIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InstanceSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref OdooPort
      ToPort: !Ref OdooPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: marathon-odoo ALB to Odoo

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: marathon-odoo-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Stack
          Value: marathon-odoo
        - Key: Name
          Value: marathon-odoo-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: marathon-odoo-tg
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref OdooPort
      TargetType: instance
      Targets:
        - Id: !Ref InstanceId
          Port: !Ref OdooPort
      HealthCheckProtocol: HTTP
      HealthCheckPath: /web/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: '86400'
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Stack
          Value: marathon-odoo
        - Key: Name
          Value: marathon-odoo-tg

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:
  AlbDnsName:
    Description: ALB DNS name
    Value: !GetAtt LoadBalancer.DNSName
  AppUrl:
    Description: Public URL
    Value: !Sub "https://${DomainName}/"
  CertificateArn:
    Description: ACM certificate ARN in use
    Value: !Ref CertificateArn
